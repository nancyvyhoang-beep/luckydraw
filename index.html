<!-- Script Xử Lý Logic API Google Sheets, Chống Reset Logo & Đồng Bộ Favicon -->
    <script>
        let prizes = [
            { id: 1, name: "MacBook Pro M4", total: 1, perDraw: 1, wonCount: 0 },
            { id: 2, name: "iPhone 17 Pro Max", total: 3, perDraw: 1, wonCount: 0 },
            { id: 3, name: "AirPods Pro 2", total: 5, perDraw: 5, wonCount: 0 }
        ];

        let participants = []; 
        let drawnParticipants = new Set();
        let allWinnersHistory = [];
        let currentActivePrizeId = 1;
        let sourceMode = 'google'; 
        let isRunning = false;
        let audioCtx = null;
        let tempCurrentRoundWinners = [];
        let forcedSecretWinner = "";
        let isSourceConfirmed = false;
        let globalLogoBase64 = "";

        window.onload = function() {
            // Khôi phục logo và favicon từ localStorage ngay khi tải lại trang (F5)
            let cachedLogo = localStorage.getItem('lucky_draw_logo');
            if (cachedLogo) {
                globalLogoBase64 = cachedLogo;
                let logoImg = document.getElementById('brand-logo-img');
                let logoDot = document.getElementById('brand-logo-dot');
                logoImg.src = globalLogoBase64;
                logoImg.classList.remove('hidden');
                logoDot.classList.add('hidden');
                logoImg.onload = function() { setSquareFavicon(logoImg); }
            }

            let cachedData = localStorage.getItem('lucky_draw_cache');
            if (cachedData) {
                try {
                    let parsed = JSON.parse(cachedData);
                    applySettingsToUI(parsed);
                } catch(e) {}
            }
            loadParticipantsFromGoogleSheet();
        };

        function setSquareFavicon(imgElement) {
            try {
                let canvas = document.createElement('canvas');
                canvas.width = 64;
                canvas.height = 64;
                let ctx = canvas.getContext('2d');
                let h = imgElement.naturalHeight || imgElement.height;
                let w = imgElement.naturalWidth || imgElement.width;
                if (!w || !h) return;
                let maxDim = Math.max(w, h);
                let dw = (maxDim - w) / 2;
                let dh = (maxDim - h) / 2;
                ctx.clearRect(0, 0, 64, 64);
                ctx.drawImage(imgElement, dw, dh, w, h);
                let favicon = document.getElementById('browser-favicon');
                if (favicon) {
                    favicon.href = canvas.toDataURL('image/png');
                }
            } catch(e) {
                console.error("Lỗi đồng bộ favicon:", e);
            }
        }

        function toggleSourceMode() {
            let mode = document.getElementById('input-source-mode').value;
            sourceMode = mode;
            isSourceConfirmed = false;
            document.getElementById('confirmed-source-status').innerText = "Nguồn dữ liệu đã thay đổi, vui lòng bấm xác nhận lại!";
            document.getElementById('confirmed-source-status').className = "text-xs text-rose-400 mt-1 italic";

            document.getElementById('source-google-box').style.display = mode === 'google' ? 'block' : 'none';
            document.getElementById('source-number-box').style.display = mode === 'number' ? 'grid' : 'none';
            document.getElementById('source-file-box').style.display = mode === 'file' ? 'block' : 'none';
        }

        async function confirmDataSource() {
            if (sourceMode === 'google') {
                let url = document.getElementById('input-gsheet-url').value.trim();
                if(!url) {
                    alert("Vui lòng nhập URL Google Sheets!");
                    return;
                }
                document.getElementById('confirmed-source-status').innerText = "⏳ Đang kết nối và lấy dữ liệu từ Google Sheets...";
                document.getElementById('confirmed-source-status').className = "text-xs text-amber-400 mt-1 italic";
                
                let success = await loadParticipantsFromGoogleSheet();
                if(!success || participants.length === 0) {
                    alert("⚠️ Không tải được dữ liệu từ Google Sheets! Vui lòng kiểm tra lại URL hoặc Tab Participants.");
                    return;
                }
            }

            isSourceConfirmed = true;
            let statusText = "";
            if (sourceMode === 'google') {
                statusText = `Đã khóa nguồn: Google Sheets (${participants.length} người).`;
            } else if (sourceMode === 'number') {
                let from = document.getElementById('num-from').value;
                let to = document.getElementById('num-to').value;
                statusText = `Đã khóa nguồn: Quay số từ ${from} đến ${to}.`;
            } else {
                statusText = `Đã khóa nguồn: File CSV (${participants.length} nhân viên).`;
            }
            document.getElementById('confirmed-source-status').innerText = `✅ ${statusText}`;
            document.getElementById('confirmed-source-status').className = "text-xs text-emerald-400 mt-1 font-semibold";
            alert("Xác nhận nguồn dữ liệu thành công!");
        }

        async function loadParticipantsFromGoogleSheet() {
            let url = document.getElementById('input-gsheet-url').value.trim();
            if(!url) return false;
            try {
                let controller = new AbortController();
                let timeoutId = setTimeout(() => controller.abort(), 8000);

                let res = await fetch(url, { signal: controller.signal });
                clearTimeout(timeoutId);
                let data = await res.json();
                
                localStorage.setItem('lucky_draw_cache', JSON.stringify(data));

                if(data.participants && Array.isArray(data.participants) && data.participants.length > 0) {
                    participants = data.participants.map(p => {
                        let mainParts = [];
                        if (p.maNV && String(p.maNV).trim() !== "") {
                            mainParts.push(String(p.maNV).trim());
                        }
                        if (p.hoTen && String(p.hoTen).trim() !== "") {
                            mainParts.push(String(p.hoTen).trim());
                        }

                        let textName = mainParts.join(" - ");

                        if (p.boPhan && String(p.boPhan).trim() !== "") {
                            return textName ? `${textName} (${String(p.boPhan).trim()})` : String(p.boPhan).trim();
                        }
                        return textName;
                    }).filter(item => item !== "");

                    document.getElementById('sheet-status-info').innerText = `Trạng thái: Đã tải ${participants.length} nhân viên từ Google Sheets!`;
                }
                
                if(data.prizes && Array.isArray(data.prizes) && data.prizes.length > 0) {
                    prizes = data.prizes;
                }

                if(data.settings) {
                    applySettingsToUI(data);
                }

                renderPrizesTable();
                updatePrizeDropdown();
                updateAdminStats();
                syncDisplayScreenInfo();
                return true;
            } catch(err) {
                console.error("Lỗi đồng bộ Google Sheets:", err);
                return false;
            }
        }

        function applySettingsToUI(data) {
            let s = data.settings;
            if(!s) return;
            if(s.eventName) {
                document.getElementById('input-event-name').value = s.eventName;
                let footerEl = document.getElementById('footer-event-name');
                if(footerEl) footerEl.innerText = `© 2026 ${s.eventName} - LUCKY DRAW PLATFORM`;
            }
            if(s.bgType) document.getElementById('bg-type').value = s.bgType;
            if(s.solidColor) document.getElementById('custom-bg-solid').value = s.solidColor;
            if(s.grad1) document.getElementById('grad-1').value = s.grad1;
            if(s.grad2) document.getElementById('grad-2').value = s.grad2;
            if(s.fontFamily) document.getElementById('custom-font-family').value = s.fontFamily;
            if(s.textColor) document.getElementById('custom-text-color').value = s.textColor;
            if(s.titleColor) document.getElementById('custom-title-color').value = s.titleColor;
            if(s.autoContrast !== undefined) document.getElementById('auto-text-contrast').checked = s.autoContrast;
            if(s.btnColor) document.getElementById('custom-brand-btn-color').value = s.btnColor;
            if(s.spinDuration) document.getElementById('input-spin-duration').value = s.spinDuration;
            
            if(s.logoBase64) {
                globalLogoBase64 = s.logoBase64;
                localStorage.setItem('lucky_draw_logo', globalLogoBase64);
                let logoImg = document.getElementById('brand-logo-img');
                let logoDot = document.getElementById('brand-logo-dot');
                logoImg.src = globalLogoBase64;
                logoImg.classList.remove('hidden');
                logoDot.classList.add('hidden');
                logoImg.onload = function() { setSquareFavicon(logoImg); }
            }
            toggleBgInputs();
            applyBrandGuidelinesLocally();
        }

        async function savePrizesConfigToGoogleSheet() {
            let url = document.getElementById('input-gsheet-url').value.trim();
            if(!url) return;
            
            let eventNameVal = document.getElementById('input-event-name').value;
            let footerEl = document.getElementById('footer-event-name');
            if(footerEl) footerEl.innerText = `© 2026 ${eventNameVal} - LUCKY DRAW PLATFORM`;

            let currentSettings = {
                eventName: eventNameVal,
                bgType: document.getElementById('bg-type').value,
                solidColor: document.getElementById('custom-bg-solid').value,
                grad1: document.getElementById('grad-1').value,
                grad2: document.getElementById('grad-2').value,
                fontFamily: document.getElementById('custom-font-family').value,
                textColor: document.getElementById('custom-text-color').value,
                titleColor: document.getElementById('custom-title-color').value,
                autoContrast: document.getElementById('auto-text-contrast').checked,
                btnColor: document.getElementById('custom-brand-btn-color').value,
                spinDuration: document.getElementById('input-spin-duration').value,
                logoBase64: globalLogoBase64
            };

            try {
                await fetch(url, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "saveSettings",
                        prizes: prizes,
                        customSettings: currentSettings
                    })
                });
            } catch(e) {}
        }

        async function pushWinnerToGoogleSheet(prizeName, winnerInfo) {
            let url = document.getElementById('input-gsheet-url').value.trim();
            if(!url) return;
            try {
                await fetch(url, {
                    method: "POST",
                    body: JSON.stringify({
                        time: new Date().toLocaleTimeString(),
                        prizeName: prizeName,
                        winnerInfo: winnerInfo
                    })
                });
            } catch(e) {}
        }

        function openSecretWinnerModal() {
            let currentVal = forcedSecretWinner ? `Đang chỉ định: ${forcedSecretWinner}` : "Không có (Quay ngẫu nhiên)";
            let input = prompt(`[CHẾ ĐỘ BÍ MẬT - RIGGED DRAW]\nNhập chính xác tên/mã nhân viên muốn ép thắng cho lượt quay tới\n(Trạng thái hiện tại: ${currentVal})\n\nNhập để trống hoặc 'clear' để xóa chỉ định:`, forcedSecretWinner);
            
            if (input !== null) {
                if (input.trim() === "" || input.trim().toLowerCase() === "clear") {
                    forcedSecretWinner = "";
                    alert("Đã xóa cấu hình chỉ định!");
                } else {
                    forcedSecretWinner = input.trim();
                    alert(`Đã gán thành công người chiến thắng tiếp theo: "${forcedSecretWinner}"!`);
                }
            }
        }

        function playSound(type = 'tick', stepRatio = 0.5) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                if (type === 'tick') {
                    let freq = 250 + Math.pow(stepRatio, 2) * 900;
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.04);
                } else if (type === 'win') {
                    [440, 554.37, 659.25, 880, 1108.73].forEach((f, i) => {
                        let o = audioCtx.createOscillator();
                        let g = audioCtx.createGain();
                        o.type = 'square';
                        o.connect(g); g.connect(audioCtx.destination);
                        o.frequency.value = f;
                        g.gain.setValueAtTime(0.08, audioCtx.currentTime + (i * 0.08));
                        o.start(audioCtx.currentTime + (i * 0.08));
                        o.stop(audioCtx.currentTime + 0.5);
                    });
                }
            } catch(e) {}
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById('btn-tab-control').className = "px-4 py-2 rounded-xl text-xs font-bold transition bg-slate-800 hover:bg-slate-700 text-slate-300";
            document.getElementById('btn-tab-display').className = "px-4 py-2 rounded-xl text-xs font-bold transition bg-slate-800 hover:bg-slate-700 text-slate-300";

            if (tabName === 'control') {
                document.getElementById('tab-control').classList.add('active');
                document.getElementById('btn-tab-control').className = "px-4 py-2 rounded-xl text-xs font-bold transition brand-btn shadow-lg";
                updateAdminStats();
            } else {
                document.getElementById('tab-display').classList.add('active');
                document.getElementById('btn-tab-display').className = "px-4 py-2 rounded-xl text-xs font-bold transition brand-btn shadow-lg";
                syncDisplayScreenInfo();
            }
        }

        function goToDisplayAndReady() {
            if (!isSourceConfirmed) {
                alert("⚠️ Vui lòng bấm nút 'Xác nhận data' ở phần quản lý nguồn dữ liệu trước khi mở màn hình quay!");
                return;
            }
            if (sourceMode === 'google' && participants.length === 0) {
                alert("⚠️ Danh sách người tham gia từ Google Sheets đang trống! Vui lòng kiểm tra lại tab Participants.");
                return;
            }
            switchTab('display');
        }

        function toggleBgInputs() {
            let type = document.getElementById('bg-type').value;
            document.getElementById('bg-solid-box').style.display = type === 'solid' ? 'block' : 'none';
            document.getElementById('bg-gradient-box').style.display = type === 'gradient' ? 'grid' : 'none';
            document.getElementById('bg-image-box').style.display = type === 'image' ? 'block' : 'none';
        }

        function getContrastTextColor(hexColor) {
            hexColor = hexColor.replace('#', '');
            if (hexColor.length === 3) {
                hexColor = hexColor.split('').map(c => c + c).join('');
            }
            let r = parseInt(hexColor.substr(0, 2), 16);
            let g = parseInt(hexColor.substr(2, 2), 16);
            let b = parseInt(hexColor.substr(4, 2), 16);
            let yiq = (r * 299 + g * 587 + b * 114) / 1000;
            return yiq >= 128 ? '#0f172a' : '#ffffff';
        }

        function applyBrandGuidelinesLocally() {
            let bgType = document.getElementById('bg-type').value;
            let fontFamily = document.getElementById('custom-font-family').value;
            let eventName = document.getElementById('input-event-name').value;
            let brandBtnColor = document.getElementById('custom-brand-btn-color').value;
            let customTextColor = document.getElementById('custom-text-color').value;
            let customTitleColor = document.getElementById('custom-title-color').value;
            let isAutoContrast = document.getElementById('auto-text-contrast').checked;
            
            let body = document.getElementById('app-body');
            body.style.fontFamily = fontFamily;

            let finalTextColor = customTextColor;
            let finalTitleColor = customTitleColor;

            if (bgType === 'solid') {
                let solidColor = document.getElementById('custom-bg-solid').value;
                body.style.backgroundImage = 'none';
                body.style.backgroundColor = solidColor;
                if (isAutoContrast) {
                    finalTextColor = getContrastTextColor(solidColor);
                    finalTitleColor = finalTextColor;
                }
            } else if (bgType === 'gradient') {
                let c1 = document.getElementById('grad-1').value;
                let c2 = document.getElementById('grad-2').value;
                body.style.backgroundImage = `linear-gradient(135deg, ${c1}, ${c2})`;
                if (isAutoContrast) {
                    finalTextColor = getContrastTextColor(c1);
                    finalTitleColor = finalTextColor;
                }
            } else if (bgType === 'image') {
                let fileInput = document.getElementById('custom-bg-file');
                if (fileInput.files && fileInput.files[0]) {
                    let reader = new FileReader();
                    reader.onload = function(e) {
                        body.style.backgroundImage = `url('${e.target.result}')`;
                    }
                    reader.readAsDataURL(fileInput.files[0]);
                }
                if (isAutoContrast) {
                    finalTextColor = '#f8fafc';
                    finalTitleColor = '#f8fafc';
                }
            }

            body.style.color = finalTextColor;
            document.documentElement.style.setProperty('--title-text-color', finalTitleColor);

            let btnTextColor = getContrastTextColor(brandBtnColor);
            document.documentElement.style.setProperty('--brand-btn-bg', brandBtnColor);
            document.documentElement.style.setProperty('--brand-btn-text', btnTextColor);

            document.getElementById('browser-tab-title').innerText = eventName + " - Lucky Draw";
            syncDisplayScreenInfo();
        }

        function applyBrandGuidelines() {
            let logoFile = document.getElementById('custom-logo-file');
            if (logoFile.files && logoFile.files[0]) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    globalLogoBase64 = e.target.result;
                    localStorage.setItem('lucky_draw_logo', globalLogoBase64);
                    let logoImg = document.getElementById('brand-logo-img');
                    let logoDot = document.getElementById('brand-logo-dot');
                    logoImg.src = globalLogoBase64;
                    logoImg.classList.remove('hidden');
                    logoDot.classList.add('hidden');
                    logoImg.onload = function() { setSquareFavicon(logoImg); }
                    
                    applyBrandGuidelinesLocally();
                    savePrizesConfigToGoogleSheet();
                }
                reader.readAsDataURL(logoFile.files[0]);
            } else {
                applyBrandGuidelinesLocally();
                savePrizesConfigToGoogleSheet();
            }
        }

        function renderPrizesTable() {
            let tbody = document.getElementById('prizes-table-body');
            tbody.innerHTML = "";
            prizes.forEach((p, idx) => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-2.5"><input type="text" value="${p.name}" onchange="prizes[${idx}].name = this.value; updatePrizeDropdown();" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs"></td>
                    <td class="p-2.5"><input type="number" min="1" value="${p.total}" onchange="prizes[${idx}].total = parseInt(this.value)||1; updateAdminStats();" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs"></td>
                    <td class="p-2.5"><input type="number" min="1" value="${p.perDraw}" onchange="prizes[${idx}].perDraw = parseInt(this.value)||1;" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs"></td>
                    <td class="p-2.5 text-center"><button onclick="removePrize(${idx})" class="text-rose-400 hover:text-rose-300 font-bold px-2 py-1">✕</button></td>
                `;
                tbody.appendChild(tr);
            });
            updatePrizeDropdown();
        }

        function addPrizeRow() {
            prizes.push({ id: Date.now(), name: "Giải Mới", total: 1, perDraw: 1, wonCount: 0 });
            renderPrizesTable();
        }

        function removePrize(idx) {
            if (prizes.length <= 1) {
                alert('Phải giữ lại ít nhất 1 giải thưởng!');
                return;
            }
            prizes.splice(idx, 1);
            renderPrizesTable();
        }

        function savePrizesConfig() {
            updatePrizeDropdown();
            savePrizesConfigToGoogleSheet();
        }

        function updatePrizeDropdown() {
            let selectAdmin = document.getElementById('select-active-prize');
            let selectDisplay = document.getElementById('display-select-prize');
            
            [selectAdmin, selectDisplay].forEach(sel => {
                if(!sel) return;
                sel.innerHTML = "";
                prizes.forEach(p => {
                    let opt = document.createElement('option');
                    opt.value = p.id;
                    opt.innerText = `${p.name} (Còn: ${p.total - p.wonCount}/${p.total})`;
                    if (p.id == currentActivePrizeId) opt.selected = true;
                    sel.appendChild(opt);
                });
            });
            syncDisplayScreenInfo();
        }

        function onSelectedPrizeChange() {
            let sel = document.getElementById('select-active-prize');
            if(sel) currentActivePrizeId = parseInt(sel.value);
            let selDisp = document.getElementById('display-select-prize');
            if(selDisp) selDisp.value = currentActivePrizeId;
            syncDisplayScreenInfo();
        }

        function onDisplayPrizeChange() {
            let selDisp = document.getElementById('display-select-prize');
            if(selDisp) currentActivePrizeId = parseInt(selDisp.value);
            let selAdmin = document.getElementById('select-active-prize');
            if(selAdmin) selAdmin.value = currentActivePrizeId;
            syncDisplayScreenInfo();
        }

        function onDisplayPerDrawChange() {
            let activeP = prizes.find(p => p.id == currentActivePrizeId);
            let val = parseInt(document.getElementById('display-input-per-draw').value);
            if(activeP && val > 0) {
                activeP.perDraw = val;
                updateAdminStats();
            }
        }

        function updateAdminStats() {
            let activeP = prizes.find(p => p.id == currentActivePrizeId) || prizes[0];
            if (!activeP) return;
            let elTotal = document.getElementById('info-total-prize');
            let elWon = document.getElementById('info-won-prize');
            let elPer = document.getElementById('info-per-draw');
            if(elTotal) elTotal.innerText = activeP.total;
            if(elWon) elWon.innerText = `${activeP.wonCount} / ${activeP.total}`;
            if(elPer) elPer.innerText = activeP.perDraw;
        }

        function syncDisplayScreenInfo() {
            let eventName = document.getElementById('input-event-name').value;
            let headerTitle = document.getElementById('header-event-title');
            let dispBadge = document.getElementById('display-event-badge');
            let footerEl = document.getElementById('footer-event-name');
            if(headerTitle) headerTitle.innerText = eventName;
            if(dispBadge) dispBadge.innerText = eventName;
            if(footerEl) footerEl.innerText = `© 2026 ${eventName} - LUCKY DRAW PLATFORM`;

            let activeP = prizes.find(p => p.id == currentActivePrizeId) || prizes[0];
            if (!activeP) return;

            let dispTot = document.getElementById('disp-total-q');
            let dispWon = document.getElementById('disp-won-q');
            let dispActiveName = document.getElementById('disp-active-name');
            let dispPerDrawInput = document.getElementById('display-input-per-draw');

            if(dispTot) dispTot.innerText = activeP.total;
            if(dispWon) dispWon.innerText = `${activeP.wonCount} / ${activeP.total}`;
            if(dispActiveName) dispActiveName.innerText = activeP.name;
            if(dispPerDrawInput && document.activeElement !== dispPerDrawInput) {
                dispPerDrawInput.value = activeP.perDraw;
            }
            updateAdminStats();
        }

        function downloadSampleCSV() {
            let sampleContent = "\uFEFFSTT;Mã nhân viên;Họ và tên;Bộ phận\n1;EMP001;Nguyễn Văn An;Phòng Công Nghệ\n2;EMP002;Trần Thị Bình;Phòng Nhân Sự\n3;EMP003;Lê Hoàng Cường;Phòng Kinh Doanh\n4;EMP004;Phạm Thị Dung;Phòng Marketing\n5;EMP005;Hoàng Văn Em;Phòng Tài Chính";
            let blob = new Blob([sampleContent], { type: "text/csv;charset=utf-8;" });
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url;
            a.download = "danh_sach_nhan_vien_chuan_cot.csv";
            a.click();
        }

        let fileInputEl = document.getElementById('import-file');
        if(fileInputEl) {
            fileInputEl.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(evt) {
                    let text = evt.target.result;
                    let lines = text.split(/\r\n|\n/).map(l => l.trim()).filter(l => l.length > 0);
                    if (lines.length > 0 && (lines[0].toLowerCase().includes('stt') || lines[0].toLowerCase().includes('mã'))) {
                        lines.shift();
                    }
                    participants = lines.map(line => {
                        let parts = line.split(/;|,|\t/);
                        if (parts.length >= 4) {
                            return `${parts[1].trim()} - ${parts[2].trim()} (${parts[3].trim()})`;
                        } else if (parts.length >= 3) {
                            return `${parts[1].trim()} - ${parts[2].trim()}`;
                        }
                        return line;
                    });
                    alert(`Đã upload thành công ${participants.length} nhân viên từ file CSV!`);
                };
                reader.readAsText(file, "UTF-8");
            });
        }

        function startSpinningAnimation() {
            if (isRunning) return;
            let activeP = prizes.find(p => p.id == currentActivePrizeId);
            if (!activeP) return;

            if (activeP.wonCount >= activeP.total) {
                alert(`Giải "${activeP.name}" đã trao đủ số lượng! Vui lòng chọn giải khác.`);
                return;
            }

            let availablePool = sourceMode === 'number' ? [] : participants.filter(p => !drawnParticipants.has(p));

            if (sourceMode !== 'number' && availablePool.length === 0) {
                alert("⚠️ Tất cả nhân viên trong danh sách đều đã trúng giải! Không còn người để quay tiếp.");
                return;
            }

            document.getElementById('start-draw-container').style.display = 'none';
            document.getElementById('action-buttons-bar').style.display = 'none';
            document.getElementById('display-winners-container').innerHTML = '';

            isRunning = true;
            let rollerBox = document.getElementById('display-roller-box');
            
            let remainingPrize = activeP.total - activeP.wonCount;
            let countToDraw = Math.min(activeP.perDraw, remainingPrize);

            let durationSec = parseFloat(document.getElementById('input-spin-duration').value) || 3;
            let totalSteps = Math.max(15, Math.floor((durationSec * 1000) / 50));
            let counter = 0;

            let spinInterval = setInterval(() => {
                let stepRatio = counter / totalSteps;
                playSound('tick', stepRatio);
                rollerBox.style.transform = `translateY(${Math.sin(counter) * 12}px)`;

                if (sourceMode === 'number') {
                    let from = parseInt(document.getElementById('num-from').value) || 1;
                    let to = Math.min(99999999, parseInt(document.getElementById('num-to').value) || 99999999);
                    let randNum = Math.floor(Math.random() * (to - from + 1)) + from;
                    let strNum = String(randNum);
                    rollerBox.innerText = strNum.padStart(Math.min(8, String(to).length), '0');
                } else {
                    let randIdx = Math.floor(Math.random() * availablePool.length);
                    rollerBox.innerText = availablePool[randIdx];
                }

                counter++;
                if (counter >= totalSteps) {
                    clearInterval(spinInterval);
                    rollerBox.style.transform = 'translateY(0)';
                    finalizeRound(countToDraw, availablePool);
                }
            }, 50);
        }

        function finalizeRound(countToDraw, availablePool) {
            isRunning = false;
            playSound('win');

            tempCurrentRoundWinners = [];

            if (forcedSecretWinner && countToDraw === 1) {
                tempCurrentRoundWinners.push(forcedSecretWinner);
                drawnParticipants.add(forcedSecretWinner);
                forcedSecretWinner = "";
            } else {
                if (sourceMode === 'number') {
                    let from = parseInt(document.getElementById('num-from').value) || 1;
                    let to = Math.min(99999999, parseInt(document.getElementById('num-to').value) || 99999999);
                    let pool = [];
                    for(let i=from; i<=to; i++) {
                        pool.push(String(i).padStart(Math.min(8, String(to).length), '0'));
                    }
                    
                    for(let i=0; i<countToDraw; i++) {
                        if(pool.length === 0) break;
                        let idx = Math.floor(Math.random() * pool.length);
                        tempCurrentRoundWinners.push(pool.splice(idx, 1)[0]);
                    }
                } else {
                    let pool = [...availablePool];
                    for(let i=0; i<countToDraw; i++) {
                        if(pool.length === 0) break;
                        let idx = Math.floor(Math.random() * pool.length);
                        let winner = pool.splice(idx, 1)[0];
                        tempCurrentRoundWinners.push(winner);
                        drawnParticipants.add(winner);
                    }
                }
            }

            document.getElementById('display-roller-box').innerHTML = `<span class="text-xl md:text-3xl font-extrabold tracking-widest uppercase text-emerald-400 drop-shadow">🎉 CHÚC MỪNG NGƯỜI TRÚNG GIẢI 🎉</span>`;
            
            let currentBodyColor = window.getComputedStyle(document.getElementById('app-body')).color;

            let winnersContainer = document.getElementById('display-winners-container');
            winnersContainer.innerHTML = "";
            tempCurrentRoundWinners.forEach(w => {
                let card = document.createElement('div');
                card.className = "winner-card px-8 py-4 bg-slate-900 border-4 border-emerald-500 rounded-3xl shadow-2xl text-2xl md:text-5xl font-black tracking-wider text-center mx-auto";
                card.style.color = currentBodyColor;
                card.innerText = w;
                winnersContainer.appendChild(card);
            });

            document.getElementById('action-buttons-bar').style.display = 'flex';

            confetti({
                particleCount: 180,
                spread: 100,
                origin: { y: 0.6 }
            });
        }

        function saveAndNext() {
            let activeP = prizes.find(p => p.id == currentActivePrizeId);
            if (!activeP) return;

            activeP.wonCount += tempCurrentRoundWinners.length;

            allWinnersHistory.push({
                prizeName: activeP.name,
                winners: [...tempCurrentRoundWinners],
                time: new Date().toLocaleTimeString()
            });

            tempCurrentRoundWinners.forEach(winner => {
                pushWinnerToGoogleSheet(activeP.name, winner);
            });
            savePrizesConfigToGoogleSheet();

            tempCurrentRoundWinners = [];
            updatePrizeDropdown();
            syncDisplayScreenInfo();

            let toast = document.getElementById('save-status-toast');
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 2000);

            document.getElementById('display-roller-box').innerText = "SẴN SÀNG";
            document.getElementById('display-winners-container').innerHTML = "";
            document.getElementById('action-buttons-bar').style.display = 'none';
            document.getElementById('start-draw-container').style.display = 'block';
        }

        function discardAndRetry() {
            if (confirm('Bạn có chắc muốn huỷ kết quả lượt này và tiến hành quay lại giải này không?')) {
                tempCurrentRoundWinners.forEach(w => drawnParticipants.delete(w));
                tempCurrentRoundWinners = [];
                document.getElementById('display-roller-box').innerText = "SẴN SÀNG";
                document.getElementById('display-winners-container').innerHTML = "";
                document.getElementById('action-buttons-bar').style.display = 'none';
                document.getElementById('start-draw-container').style.display = 'block';
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {});
            } else {
                if (document.exitFullscreen) { document.exitFullscreen(); }
            }
        }

        function exportResult() {
            if (allWinnersHistory.length === 0) {
                alert('Chưa có dữ liệu trúng thưởng nào được lưu!');
                return;
            }
            let csvContent = "\uFEFFThời gian;Giải thưởng;Người trúng thưởng\n";
            allWinnersHistory.forEach(item => {
                item.winners.forEach(w => {
                    csvContent += `"${item.time}";"${item.prizeName}";"${w}"\n`;
                });
            });

            let blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url;
            a.download = "ket_qua_trung_thuong_lucky_draw.csv";
            a.click();
        }

        function resetWinnersOnly() {
            if (confirm('Bạn có muốn reset danh sách người trúng thưởng để mọi người có thể quay lại từ đầu không? (Số lượng đã trúng của các giải sẽ về 0)')) {
                prizes.forEach(p => p.wonCount = 0);
                drawnParticipants.clear();
                allWinnersHistory = [];
                tempCurrentRoundWinners = [];
                savePrizesConfigToGoogleSheet();
                updatePrizeDropdown();
                alert('Đã reset danh sách người trúng thưởng thành công! Bây giờ bạn có thể quay lại từ đầu.');
            }
        }

        function resetSystem() {
            if (confirm('Bạn có chắc muốn reset toàn bộ hệ thống và dữ liệu trúng thưởng không?')) {
                prizes.forEach(p => p.wonCount = 0);
                allWinnersHistory = [];
                tempCurrentRoundWinners = [];
                drawnParticipants.clear();
                savePrizesConfigToGoogleSheet();
                updatePrizeDropdown();
                document.getElementById('display-roller-box').innerText = "SẴN SÀNG";
                document.getElementById('display-winners-container').innerHTML = "";
                document.getElementById('action-buttons-bar').style.display = 'none';
                document.getElementById('start-draw-container').style.display = 'block';
                alert('Đã reset hệ thống thành công!');
            }
        }
    </script>
</body>
</html>
