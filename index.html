<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CH TRADING RACING</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-layer: radial-gradient(circle at 50% 0%, #1e2530 0%, #0b0e14 60%, #030406 100%);
            --primary-color: #38bdf8;
            --secondary-color: #f43f5e;
            --panel-bg: rgba(18, 22, 29, 0.85);
            --text-main: #f8fafc;
            --input-bg: rgba(0, 0, 0, 0.5);
            --border-color: rgba(56, 189, 248, 0.2);
        }

        body { 
            margin: 0; overflow: hidden; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background-image: var(--bg-layer) !important; background-size: cover !important;
            background-position: center !important; background-repeat: no-repeat !important;
            background-attachment: fixed !important; background-color: #030406 !important;
            color: var(--text-main) !important; transition: all 0.5s ease;
        }

        .bento-panel { 
            background: var(--panel-bg); 
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-color); 
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.7);
            transition: all 0.4s ease;
        }

        .text-muted { color: var(--text-main); opacity: 0.65; }
        .theme-text-gradient { 
            background: linear-gradient(135deg, var(--text-main) 30%, var(--primary-color) 100%); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
        }
        .theme-btn { 
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); 
            color: #fff; font-weight: 600; letter-spacing: 0.025em;
            box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        .theme-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .theme-text { color: var(--primary-color); }
        
        .shadow-glow { box-shadow: 0 0 30px var(--primary-color); }
        .finish-line { background: linear-gradient(to bottom, #fff, var(--primary-color), #fff); box-shadow: 0 0 20px var(--primary-color); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        
        .custom-input { 
            background: var(--input-bg); border: 1px solid var(--border-color); 
            transition: all 0.3s ease; color: var(--text-main); border-radius: 0.75rem; 
        }
        .custom-input:focus { border-color: var(--primary-color); box-shadow: 0 0 15px rgba(56, 189, 248, 0.25); outline: none; }
        .custom-input option { background: #0f1218; color: #fff; }

        input[type="color"] { -webkit-appearance: none; border: none; padding: 0; }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 1px solid var(--border-color); border-radius: 6px; }

        .racing-toolbar { position: absolute; top: 0; left: 0; right: 0; z-index: 100; transform: translateY(-100%); opacity: 0; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease; }
        .racing-toolbar.show-toolbar { transform: translateY(0); opacity: 1; }
        .hover-trigger-area { position: absolute; top: 0; left: 0; right: 0; height: 50px; z-index: 99; }

        .racer-wrapper { position: absolute; display: flex; align-items: center; z-index: 30; transition: left 0.1s linear, top 0.1s linear; }
        
        .racer-icon-flip { display: inline-block; transform: scaleX(-1); animation: horseBounce 0.25s infinite alternate ease-in-out; filter: drop-shadow(0px 4px 12px rgba(0,0,0,0.5)); line-height: 1; }
        @keyframes horseBounce { 0% { transform: scaleX(-1) translateY(2px) rotate(-3deg); } 100% { transform: scaleX(-1) translateY(-2px) rotate(3deg); } }

        .racer-icon { display: inline-block; animation: bounceAnim 0.3s infinite alternate; filter: drop-shadow(0px 4px 12px rgba(0,0,0,0.5)); line-height: 1; }
        @keyframes bounceAnim { 0% { transform: translateY(2px) rotate(-3deg); } 100% { transform: translateY(-2px) rotate(3deg); } }

        .racer-icon-bird { display: inline-block; transform: scaleX(1); animation: birdFlyAnim 0.25s infinite alternate ease-in-out; filter: drop-shadow(0px 4px 12px rgba(0,0,0,0.5)); line-height: 1; }
        @keyframes birdFlyAnim { 0% { transform: scaleX(1) translateY(2px) rotate(-4deg); } 100% { transform: scaleX(1) translateY(-2px) rotate(4deg); } }

        .speed-trail { position: absolute; right: 85%; height: 2px; background: linear-gradient(to right, transparent, var(--primary-color)); border-radius: 5px; opacity: 0.7; pointer-events: none; }
        .trail-1 { transform: translateY(-6px); width: 25px; } 
        .trail-2 { transform: translateY(0px); width: 35px; } 
        .trail-3 { transform: translateY(6px); width: 18px; }

        /* ================= BACKGROUND ĐƯỜNG ĐUA ================= */
        .track-bg-horse { 
            background: linear-gradient(180deg, #3d2617 0%, #17100b 100%); 
            position: relative; overflow-y: auto; overflow-x: hidden;
        }
        .track-bg-horse::before {
            content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 30px;
            background: repeating-linear-gradient(90deg, #92400e, #92400e 16px, #451a03 16px, #451a03 32px, #b45309 32px, #b45309 38px);
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.6);
            animation: fenceMove 2.5s linear infinite; pointer-events: none;
        }
        @keyframes fenceMove { 0% { background-position: 0 0; } 100% { background-position: -76px 0; } }
        .effect-dust { position: absolute; right: 75%; bottom: -4px; width: 18px; height: 6px; background: rgba(222, 184, 135, 0.7); border-radius: 50%; filter: blur(2px); animation: dustAnim 0.35s infinite linear; }
        @keyframes dustAnim { 0% { transform: scale(0.4); opacity: 0.9; } 100% { transform: scale(1.8) translateX(-20px); opacity: 0; } }
        .track-lane-horse { border-bottom: 1px solid rgba(217, 119, 6, 0.3); background: rgba(139, 69, 19, 0.15); }

        .track-bg-car { background: #0b0f19; background-image: linear-gradient(90deg, rgba(56, 189, 248, 0.05) 50%, transparent 50%); background-size: 80px 100%; overflow-y: auto; overflow-x: hidden; }
        .effect-smoke { position: absolute; right: 70%; top: 30%; width: 14px; height: 14px; background: rgba(180, 180, 180, 0.65); border-radius: 50%; filter: blur(3px); animation: smokeAnim 0.3s infinite linear; }
        @keyframes smokeAnim { 0% { transform: scale(0.5); opacity: 0.9; } 100% { transform: scale(2.2) translateY(-8px) translateX(-20px); opacity: 0; } }
        .track-lane-car { border-bottom: 1px dashed rgba(56, 189, 248, 0.3); background: rgba(30, 41, 59, 0.6); }

        .track-bg-duck { 
            background: linear-gradient(180deg, #022c43 0%, #011627 100%); 
            position: relative; overflow-y: auto; overflow-x: hidden;
        }
        .track-bg-duck::before {
            content: ''; position: absolute; inset: 0; opacity: 0.15; pointer-events: none;
            background: repeating-linear-gradient(45deg, transparent, transparent 20px, rgba(56,189,248,0.3) 20px, rgba(56,189,248,0.3) 24px);
            animation: waterFlow 4s linear infinite;
        }
        @keyframes waterFlow { 0% { background-position: 0 0; } 100% { background-position: 50px 50px; } }
        .track-lane-duck { border-bottom: 1px solid rgba(56, 189, 248, 0.4); background: rgba(3, 105, 161, 0.2); }

        .track-bg-bird { 
            background: linear-gradient(180deg, #1e40af 0%, #0f172a 100%); 
            position: relative; overflow-y: auto; overflow-x: hidden;
        }
        .track-bg-bird::before {
            content: ''; position: absolute; inset: 0; opacity: 0.3; pointer-events: none;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, transparent 70%);
            background-repeat: repeat-x;
            background-size: 500px 100%;
            animation: cloudSmoothLoop 15s linear infinite;
        }
        @keyframes cloudSmoothLoop { 0% { background-position: 0 0; } 100% { background-position: 500px 0; } }
        .effect-cloud { position: absolute; right: 70%; top: 20%; width: 26px; height: 8px; background: rgba(255, 255, 255, 0.5); border-radius: 10px; filter: blur(2px); animation: cloudFly 0.4s infinite linear; }
        @keyframes cloudFly { 0% { transform: translateX(0); opacity: 0.7; } 100% { transform: translateX(-30px); opacity: 0; } }
        .track-lane-bird { border-bottom: 1px dashed rgba(255, 255, 255, 0.3); background: rgba(255, 255, 255, 0.05); }

        .track-bg-boat { 
            background: linear-gradient(180deg, #0f766e 0%, #042f2e 100%); 
            position: relative; overflow-y: auto; overflow-x: hidden;
        }
        .track-lane-boat { border-bottom: 2px solid rgba(45, 212, 191, 0.35); background: rgba(20, 184, 166, 0.15); }

        /* ================= HIỆU ỨNG ĐẶC BIỆT ================= */
        .vip-turbo { z-index: 900 !important; }
        .vip-turbo .racer-icon, .vip-turbo .racer-icon-flip, .vip-turbo .racer-icon-bird {
            transform: scale(1.4) !important;
            filter: drop-shadow(0 0 25px var(--secondary-color)) brightness(1.4) !important;
        }

        .winner-pop { z-index: 9999 !important; transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) !important; }
        .winner-pop .racer-icon, .winner-pop .racer-icon-flip, .winner-pop .racer-icon-bird {
            animation: crazyDance 0.25s infinite alternate ease-in-out !important; 
            filter: drop-shadow(0 0 40px var(--primary-color)) drop-shadow(0 0 80px var(--secondary-color)) brightness(1.6) !important;
        }
        .winner-pop div:first-child { 
            font-size: 1.5rem !important; line-height: 2rem !important; 
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)) !important; 
            color: #fff !important; padding: 10px 24px !important; border-radius: 1rem !important; 
            border: 2px solid rgba(255,255,255,0.3) !important; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.6) !important;
            margin-bottom: 20px !important; transform: scale(1.3);
        }
        
        @keyframes crazyDance {
            0% { transform: translateY(0) rotate(-15deg) scale(1); }
            100% { transform: translateY(-35px) rotate(15deg) scale(1.15); }
        }
        
        .loser-fade { opacity: 0.08 !important; filter: grayscale(100%) blur(4px) !important; transform: scale(0.4) !important; z-index: 0 !important; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <audio id="bgMusic" loop preload="auto" src="https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3?filename=suspense-113264.mp3"></audio>
    <audio id="winAudio" preload="auto" src="winner.mp3"></audio>

    <div id="setupMode" class="w-full h-full overflow-y-auto p-4 md:p-8 flex items-center justify-center">
        <div class="bento-panel rounded-[2rem] p-6 md:p-8 w-full max-w-7xl grid grid-cols-1 lg:grid-cols-4 gap-8 relative">
            
            <div class="lg:col-span-1 flex flex-col gap-4 border-r border-white/10 pr-0 lg:pr-6">
                <div class="text-center mb-2">
                    <h1 id="mainTitleDisplay" ondblclick="toggleVipPanel()" class="text-2xl lg:text-3xl font-black tracking-tight theme-text-gradient uppercase cursor-default select-none transition-all hover:opacity-90">CH TRADING</h1>
                    <!-- Ô SUBTITLE ĐƯỢC THIẾT KẾ DẠNG INPUT RÕ RÀNG, DỄ CLICK VÀ CHỈNH SỬA -->
                    <input type="text" id="subtitleInput" value="MASTER EDITION" class="custom-input w-full mt-2 py-1 px-3 text-center text-xs font-semibold tracking-widest uppercase cursor-pointer">
                </div>

                <div class="bg-black/30 rounded-2xl p-5 border border-white/5 flex-1 flex flex-col">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold text-sm tracking-wide theme-text">📋 Lịch Sử Đua</h3>
                        <span id="roundCounterBadge" class="text-xs bg-white/10 px-2.5 py-1 rounded-lg text-white font-semibold border border-white/10">Vòng 1</span>
                    </div>
                    
                    <div id="historyList" class="flex-1 overflow-y-auto flex flex-col gap-2 mb-4 max-h-[30vh] lg:max-h-[40vh]">
                        <p class="text-muted text-xs text-center italic mt-6" id="emptyHistoryMsg">Chưa có kết quả ghi nhận</p>
                    </div>

                    <button onclick="exportExcel()" class="w-full py-3 bg-emerald-600/80 hover:bg-emerald-600 rounded-xl font-bold text-xs tracking-wider uppercase transition-all flex items-center justify-center gap-2 shadow-lg border border-emerald-500/30 text-white">
                        <span>📊</span> Xuất file Excel
                    </button>
                </div>
            </div>

            <div class="lg:col-span-3 flex flex-col gap-5">
                
                <div class="bento-panel p-5 rounded-2xl flex flex-col gap-4">
                    <div class="flex justify-between items-center w-full flex-wrap gap-2">
                        <label class="text-xs uppercase tracking-wider font-bold theme-text flex items-center gap-2"><span>🎨</span> Không Gian & Thương Hiệu</label>
                        <button onclick="toggleFullScreen()" class="text-xs font-semibold px-4 py-2 bg-white/5 hover:bg-white/10 border border-white/10 text-white rounded-xl transition-all flex items-center gap-2">
                            Mở Toàn Màn Hình <span>📺</span>
                        </button>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div class="flex items-center gap-3 bg-black/30 p-2.5 rounded-xl border border-white/5">
                            <label class="text-xs font-semibold text-muted whitespace-nowrap">Tên sự kiện:</label>
                            <input type="text" id="eventNameInput" value="CH TRADING" oninput="updateEventName(this.value)" class="flex-1 bg-transparent border-none outline-none text-white text-xs font-bold tracking-wide" placeholder="Nhập tên sự kiện...">
                        </div>
                        
                        <div class="flex flex-wrap gap-2 items-center justify-start md:justify-end">
                            <button onclick="changeTheme('gala')" class="text-xs font-medium px-3.5 py-2 bg-[#12161d] border border-[#38bdf8]/40 text-white rounded-xl hover:scale-105 transition">Gala Tối</button>
                            <button onclick="changeTheme('cyber')" class="text-xs font-medium px-3.5 py-2 bg-[#020617] border border-[#00f2fe]/50 text-white rounded-xl hover:scale-105 transition">Cyberpunk</button>
                            <button onclick="changeTheme('royal')" class="text-xs font-medium px-3.5 py-2 bg-[#1c0505] border border-[#ffd700]/50 text-white rounded-xl hover:scale-105 transition">Hoàng Gia</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                        <div class="flex items-center gap-3 bg-black/30 p-2.5 rounded-xl border border-white/5 col-span-2 md:col-span-1">
                            <label class="text-xs font-semibold text-muted flex-1">Màu chữ:</label>
                            <input type="color" id="textColorPicker" value="#f8fafc" onchange="updateTextColor(event)" class="w-7 h-7 rounded-lg cursor-pointer bg-transparent">
                        </div>
                        <div class="flex items-center gap-3 bg-black/30 p-2.5 rounded-xl border border-white/5 col-span-2 md:col-span-3">
                            <label class="text-xs font-semibold text-muted whitespace-nowrap">Ảnh nền (16:9):</label>
                            <input type="file" id="bgUpload" accept="image/*" class="hidden" onchange="uploadBackground(event)">
                            <button onclick="document.getElementById('bgUpload').click()" id="uploadBtnText" class="flex-1 text-xs font-semibold px-3 py-1.5 bg-white/5 text-white/80 rounded-lg hover:bg-white/10 transition truncate border border-white/10 text-left">
                                📁 Tải hình nền tuỳ chỉnh...
                            </button>
                        </div>
                    </div>
                </div>

                <div id="game-over-container" class="hidden flex-col items-center justify-center h-full text-center p-12 bg-black/30 rounded-2xl border border-white/5">
                    <div class="text-6xl mb-4 animate-bounce">👑</div>
                    <h2 class="text-2xl font-bold tracking-tight theme-text mb-4">Đã hoàn tất toàn bộ giải đấu!</h2>
                    <button onclick="resetFullGame()" class="px-8 py-3.5 theme-btn rounded-xl font-bold text-sm tracking-wider uppercase">
                        Khởi Tạo Giải Đấu Mới
                    </button>
                </div>

                <div id="setup-controls" class="flex flex-col gap-4">
                    <div id="settingsGrid" class="grid grid-cols-1 lg:grid-cols-1 gap-4">
                        
                        <div class="bento-panel p-5 rounded-2xl flex flex-col gap-4">
                            <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
                                <div class="flex flex-col">
                                    <label class="text-[10px] text-muted mb-1.5 uppercase tracking-wider font-bold">Số lượng</label>
                                    <input type="number" id="numHorses" value="5" min="2" max="150" class="custom-input w-full p-2.5 text-center text-sm font-bold">
                                </div>
                                <div class="flex flex-col">
                                    <label class="text-[10px] text-muted mb-1.5 uppercase tracking-wider font-bold">Thời gian (s)</label>
                                    <input type="number" id="raceDuration" value="10" min="5" class="custom-input w-full p-2.5 text-center text-sm font-bold">
                                </div>
                                <div class="flex flex-col">
                                    <label class="text-[10px] text-muted mb-1.5 uppercase tracking-wider font-bold">Top Thắng</label>
                                    <input type="number" id="topN" value="1" min="1" max="20" class="custom-input w-full p-2.5 text-center text-sm font-bold">
                                </div>
                                <div class="flex flex-col">
                                    <label class="text-[10px] text-muted mb-1.5 uppercase tracking-wider font-bold">Nhân vật</label>
                                    <select id="racerType" class="custom-input w-full p-2.5 text-center text-sm font-bold appearance-none cursor-pointer">
                                        <option value="horse">🐎 Ngựa</option>
                                        <option value="car">🏎️ Xe Hơi</option>
                                        <option value="duck">🐥 Vịt Vàng</option>
                                        <option value="bird">🦅 Chim</option>
                                        <option value="boat">⛵ Thuyền</option>
                                    </select>
                                </div>
                                <div class="flex flex-col">
                                    <label class="text-[10px] text-muted mb-1.5 uppercase tracking-wider font-bold text-cyan-400">Kiểu Đua</label>
                                    <select id="raceModeSelect" class="custom-input w-full p-2.5 text-center text-sm font-bold appearance-none cursor-pointer border-cyan-500/40 text-cyan-300">
                                        <option value="lanes">➖ Theo làn</option>
                                        <option value="random">🌀 Tự do</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="flex gap-2">
                                <button onclick="handleGenerateBtn()" class="flex-1 py-2.5 bg-white/5 hover:bg-white/10 border border-white/10 text-white text-xs font-semibold uppercase tracking-wider rounded-xl transition-all">Tạo Form Điền Tên</button>
                            </div>

                            <div class="pt-3 border-t border-white/5 flex gap-2">
                                <input type="file" id="csvFileInput" accept=".csv" class="hidden" onchange="importCSV(event)">
                                <button onclick="document.getElementById('csvFileInput').click()" class="flex-1 py-2.5 bg-sky-600/20 hover:bg-sky-600/30 border border-sky-500/30 rounded-xl text-sky-300 text-xs font-bold tracking-wider uppercase transition-all flex items-center justify-center gap-2">
                                    <span>📁</span> Nhập từ file Excel (CSV)
                                </button>
                                <a href="data:text/csv;charset=utf-8,%EF%BB%BFTenNguoiChoi%0ANguyen%20Van%20A%0ATran%20Thi%20B%0ALe%20Van%20C%0APham%20Van%20D" download="Mau_DanhSach.csv" class="flex-1 flex items-center justify-center text-[11px] text-center border border-white/10 rounded-xl hover:bg-black/20 transition text-muted font-semibold bg-black/10">
                                    Tải mẫu
                                </a>
                            </div>
                        </div>

                        <!-- PANEL VIP ẨN TÀNG HÌNH -->
                        <div id="vipPanel" class="bento-panel p-5 rounded-2xl relative overflow-hidden flex-col justify-center hidden border border-amber-500/40 shadow-glow">
                            <label class="block text-xs uppercase tracking-wider theme-text mb-2 font-bold flex items-center gap-2">
                                <span>🎯</span> Điều khiển kết quả (VIP Hạng 1)
                            </label>
                            <select id="targetWinner" class="custom-input w-full p-3 appearance-none cursor-pointer relative font-bold text-xs text-amber-300 border-amber-500/30">
                                <option value="random">🎲 Ngẫu nhiên (Công bằng 100%)</option>
                            </select>
                        </div>
                    </div>

                    <div class="bento-panel rounded-2xl p-5 flex-1">
                        <div class="flex justify-between items-center mb-3">
                            <h3 class="font-bold text-xs uppercase tracking-wider text-muted">Danh sách vận động viên (<span id="horseCountDisplay" class="theme-text">0</span>)</h3>
                        </div>
                        <div id="horseInputs" class="max-h-[25vh] overflow-y-auto pr-2 grid grid-cols-2 md:grid-cols-4 gap-2.5">
                        </div>
                    </div>

                    <button onclick="startRace()" class="w-full py-4 theme-btn rounded-2xl font-black text-lg tracking-widest uppercase shadow-glow transition-all flex items-center justify-center gap-3">
                        Bắt Đầu Tranh Tài <span>🏁</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- VÙNG ĐUA FULL MÀN HÌNH -->
    <div id="racingMode" class="hidden flex-col h-full bg-black/90 relative overflow-hidden">
        <div class="hover-trigger-area" onmouseenter="showToolbar()"></div>
        
        <div id="racingToolbar" class="racing-toolbar p-4" onmouseleave="hideToolbar()">
            <div class="flex justify-between items-center px-6 max-w-4xl mx-auto bento-panel rounded-2xl py-3">
                <div class="w-[120px]"></div>
                <div class="text-[11px] text-center text-white/50 font-medium tracking-wider uppercase">
                    Rê chuột lên đỉnh để hiển thị menu
                </div>
                <button onclick="goToSetup()" class="w-[120px] justify-end py-1.5 px-3 bg-rose-600/30 hover:bg-rose-600/50 border border-rose-500/40 text-rose-200 rounded-xl transition-all text-xs font-bold flex items-center gap-1.5 backdrop-blur-md">
                    <span>🛑</span> Dừng & Huỷ
                </button>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto relative w-full h-full" id="trackContainer"></div>
    </div>

    <!-- MODAL CHIẾN THẮNG -->
    <div id="winnerModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-2xl items-center justify-center z-50 p-4">
        <div class="bento-panel p-8 md:p-12 rounded-[2.5rem] border border-white/20 shadow-2xl text-center max-w-xl w-full flex flex-col max-h-[90vh]">
            <div class="text-5xl mb-3 animate-bounce filter drop-shadow-[0_0_20px_rgba(244,63,94,0.6)]">🏆</div>
            <h2 class="text-xs uppercase tracking-widest text-muted font-bold mb-1">Kết Quả Vòng <span id="winRoundText">1</span></h2>
            <div id="winnersList" class="flex-1 overflow-y-auto flex flex-col gap-2.5 my-6 px-1"></div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-auto pt-4 border-t border-white/10">
                <button onclick="nextRound()" id="nextRoundBtn" class="py-3.5 theme-btn rounded-xl font-bold text-xs uppercase tracking-wider transition-all">
                    Tiếp Tục (Loại Top Thắng)
                </button>
                <button onclick="rematch()" class="py-3.5 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl font-bold text-xs uppercase tracking-wider transition-colors text-white/80">
                    Đua Lại Vòng Này
                </button>
            </div>
        </div>
    </div>

    <script>
        function toggleVipPanel() {
            const panel = document.getElementById('vipPanel');
            const grid = document.getElementById('settingsGrid');
            if (panel.classList.contains('hidden')) {
                panel.classList.remove('hidden'); panel.classList.add('flex');
                grid.classList.remove('lg:grid-cols-1'); grid.classList.add('lg:grid-cols-2');
            } else {
                panel.classList.remove('flex'); panel.classList.add('hidden');
                grid.classList.remove('lg:grid-cols-2'); grid.classList.add('lg:grid-cols-1');
            }
        }

        function updateEventName(val) {
            const newName = val.trim() || "CH TRADING";
            document.title = newName; document.getElementById('mainTitleDisplay').innerText = newName; 
        }

        function changeTheme(themeType) {
            const root = document.documentElement;
            root.style.setProperty('--text-main', '#f8fafc'); document.getElementById('textColorPicker').value = '#f8fafc';
            root.style.setProperty('--input-bg', 'rgba(0,0,0,0.5)');
            
            if (themeType === 'gala') {
                root.style.setProperty('--bg-layer', 'radial-gradient(circle at 50% 0%, #1e2530 0%, #0b0e14 60%, #030406 100%)');
                root.style.setProperty('--primary-color', '#38bdf8'); 
                root.style.setProperty('--secondary-color', '#f43f5e');
                root.style.setProperty('--panel-bg', 'rgba(18, 22, 29, 0.85)');
                root.style.setProperty('--border-color', 'rgba(56, 189, 248, 0.2)');
            } else if (themeType === 'cyber') {
                root.style.setProperty('--bg-layer', 'radial-gradient(circle at 50% 0%, #0f172a 0%, #020617 70%, #000000 100%)');
                root.style.setProperty('--primary-color', '#00f2fe'); 
                root.style.setProperty('--secondary-color', '#ff0844');
                root.style.setProperty('--panel-bg', 'rgba(15, 23, 42, 0.9)');
                root.style.setProperty('--border-color', 'rgba(0, 242, 254, 0.4)');
            } else if (themeType === 'royal') {
                root.style.setProperty('--bg-layer', 'radial-gradient(circle at 50% 0%, #450a0a 0%, #1c0202 70%, #050000 100%)');
                root.style.setProperty('--primary-color', '#ffd700'); 
                root.style.setProperty('--secondary-color', '#ff6b00');
                root.style.setProperty('--panel-bg', 'rgba(40, 10, 10, 0.9)');
                root.style.setProperty('--border-color', 'rgba(255, 215, 0, 0.4)');
            }
        }

        function uploadBackground(event) {
            const file = event.target.files[0]; if (!file) return;
            document.getElementById('uploadBtnText').innerText = "⏳ Đang phân tích màu...";
            const imageUrl = URL.createObjectURL(file);
            const root = document.documentElement;
            root.style.setProperty('--bg-layer', `url('${imageUrl}')`);

            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                canvas.width = img.width; canvas.height = img.height; ctx.drawImage(img, 0, 0);
                try {
                    const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
                    let r = 0, g = 0, b = 0, count = 0;
                    for (let i = 0; i < data.length; i += 400) { r += data[i]; g += data[i+1]; b += data[i+2]; count++; }
                    r = Math.floor(r / count); g = Math.floor(g / count); b = Math.floor(b / count);
                    const luminance = (0.299 * r + 0.587 * g + 0.114 * b);
                    let rp = r/255, gp = g/255, bp = b/255; let max = Math.max(rp, gp, bp), min = Math.min(rp, gp, bp);
                    let h = 0, s = 0, l = (max + min) / 2;
                    if (max !== min) {
                        let d = max - min; s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                        switch (max) { case rp: h = (gp - bp) / d + (gp < bp ? 6 : 0); break; case gp: h = (bp - rp) / d + 2; break; case bp: h = (rp - gp) / d + 4; break; }
                        h *= 60;
                    }

                    if (luminance > 140) {
                        root.style.setProperty('--text-main', '#0f172a'); document.getElementById('textColorPicker').value = '#0f172a';
                        root.style.setProperty('--panel-bg', 'rgba(255, 255, 255, 0.9)'); root.style.setProperty('--input-bg', 'rgba(0, 0, 0, 0.05)');
                        root.style.setProperty('--primary-color', `hsl(${h}, 80%, 35%)`); root.style.setProperty('--secondary-color', `hsl(${(h + 40) % 360}, 80%, 45%)`);
                    } else {
                        root.style.setProperty('--text-main', '#f8fafc'); document.getElementById('textColorPicker').value = '#f8fafc';
                        root.style.setProperty('--panel-bg', 'rgba(15, 23, 42, 0.9)'); root.style.setProperty('--input-bg', 'rgba(0, 0, 0, 0.4)');
                        root.style.setProperty('--primary-color', `hsl(${h}, 80%, 65%)`); root.style.setProperty('--secondary-color', `hsl(${(h + 40) % 360}, 80%, 65%)`);
                    }
                } catch (e) {}
                document.getElementById('uploadBtnText').innerText = "📁 Đã tải ảnh nền thành công";
            };
            img.src = imageUrl; event.target.value = '';
        }

        function updateTextColor(event) { document.documentElement.style.setProperty('--text-main', event.target.value); }

        const boatSvg = `<svg xmlns="http://www.w3.org" viewBox="0 0 100 100" width="100%" height="100%" style="filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.5))"><path d="M15 65 Q 50 85, 85 65 L 75 50 C 75 50, 50 45, 25 50 Z" fill="#1e293b"/><path d="M18 62 Q 50 78, 82 62 L 72 48 C 72 48, 50 43, 28 48 Z" fill="#3b82f6"/><path d="M50 45 L 50 15 C 50 15, 70 25, 75 40 Z" fill="#f8fafc"/><path d="M47 45 L 47 18 C 47 18, 30 28, 25 40 Z" fill="#cbd5e1"/></svg>`;
        const duckSvg = `<svg xmlns="http://www.w3.org" viewBox="0 0 100 100" width="100%" height="100%" style="filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.4))"><path d="M25 55 C 25 70, 65 75, 75 55 C 80 45, 65 40, 50 42 C 40 43, 25 45, 25 55 Z" fill="#facc15" /><path d="M25 55 C 20 50, 15 52, 18 58 C 22 62, 25 55, 25 55 Z" fill="#eab308" /><circle cx="65" cy="35" r="14" fill="#facc15" /><circle cx="70" cy="32" r="2" fill="#1e293b" /><path d="M77 32 C 83 32, 85 37, 77 40 C 74 41, 75 35, 77 32 Z" fill="#f97316" /><path d="M42 52 C 38 52, 35 57, 40 62 C 48 68, 55 58, 52 53 C 48 48, 45 52, 42 52 Z" fill="#eab308" /></svg>`;

        const racerConfigs = {
            horse: { emoji: '🐎', isSvg: false, bgClass: 'track-bg-horse', laneClass: 'track-lane-horse', effectClass: 'effect-dust', iconClass: 'racer-icon-flip' },
            car: { emoji: '🏎️', isSvg: false, bgClass: 'track-bg-car', laneClass: 'track-lane-car', effectClass: 'effect-smoke', iconClass: 'racer-icon-flip' },
            duck: { emoji: duckSvg, isSvg: true, bgClass: 'track-bg-duck', laneClass: 'track-lane-duck', effectClass: 'effect-water', iconClass: 'racer-icon' },
            bird: { emoji: '🦅', isSvg: false, bgClass: 'track-bg-bird', laneClass: 'track-lane-bird', effectClass: 'effect-cloud', iconClass: 'racer-icon-bird' },
            boat: { emoji: boatSvg, isSvg: true, bgClass: 'track-bg-boat', laneClass: 'track-lane-boat', effectClass: 'effect-wake', iconClass: 'racer-icon' }
        };

        let horses = []; let raceHistory = []; let raceInterval = null; let currentWinners = []; 
        let idCounter = 0; let roundNumber = 1; let isTurboActivated = false;

        const setupMode = document.getElementById('setupMode'); const racingMode = document.getElementById('racingMode');
        const horseInputs = document.getElementById('horseInputs'); const trackContainer = document.getElementById('trackContainer'); 
        const winnerModal = document.getElementById('winnerModal'); const racingToolbar = document.getElementById('racingToolbar'); 
        const bgMusic = document.getElementById('bgMusic'); const winAudio = document.getElementById('winAudio'); 
        const targetWinnerSelect = document.getElementById('targetWinner'); const historyList = document.getElementById('historyList');

        function showToolbar() { racingToolbar.classList.add('show-toolbar'); }
        function hideToolbar() { racingToolbar.classList.remove('show-toolbar'); }

        function importCSV(event) {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.split(/\r\n|\n/).map(line => line.trim()).filter(line => line.length > 0);
                let parsedNames = lines.map(line => line.split(',')[0].replace(/^"|"$/g, '').trim()).filter(name => name.length > 0);
                const firstLower = parsedNames[0].toLowerCase();
                if (firstLower === 'tên' || firstLower === 'name' || firstLower.includes('ngựa') || firstLower.includes('choi')) parsedNames.shift();
                if (parsedNames.length === 0) { alert("File trống!"); return; }
                if (parsedNames.length > 150) { alert(`Chỉ lấy 150 người đầu tiên.`); parsedNames = parsedNames.slice(0, 150); }
                document.getElementById('numHorses').value = parsedNames.length;
                horses = []; idCounter = 0;
                parsedNames.forEach(name => { idCounter++; horses.push({ id: idCounter, name: name, progress: 0 }); });
                renderInputs(); event.target.value = '';
            };
            reader.readAsText(file);
        }

        function handleGenerateBtn() {
            const num = Math.min(Math.max(parseInt(document.getElementById('numHorses').value), 2), 150);
            document.getElementById('numHorses').value = num;
            horses = []; idCounter = 0;
            for(let i = 0; i < num; i++) { idCounter++; horses.push({ id: idCounter, name: `VĐV ${idCounter}`, progress: 0 }); }
            renderInputs();
        }

        function renderInputs() {
            document.getElementById('horseCountDisplay').innerText = horses.length;
            const currentTarget = targetWinnerSelect.value;
            targetWinnerSelect.innerHTML = '<option value="random">🎲 Ngẫu nhiên (Công bằng 100%)</option>';
            if (horses.length <= 1) {
                document.getElementById('game-over-container').classList.replace('hidden', 'flex');
                document.getElementById('setup-controls').classList.add('hidden'); return;
            }
            document.getElementById('game-over-container').classList.replace('flex', 'hidden'); document.getElementById('setup-controls').classList.remove('hidden');

            horseInputs.innerHTML = '';
            horses.forEach((h, index) => {
                const input = document.createElement('input'); input.type = 'text'; input.value = h.name;
                input.className = 'custom-input p-2.5 text-xs text-center w-full font-semibold';
                input.oninput = (e) => { horses[index].name = e.target.value; updateTargetSelectNames(); };
                horseInputs.appendChild(input);

                const option = document.createElement('option'); option.value = h.id; option.text = `Chỉ định: ${h.name}`;
                targetWinnerSelect.appendChild(option);
            });
            if (horses.find(h => h.id == currentTarget)) targetWinnerSelect.value = currentTarget;
        }

        function updateTargetSelectNames() {
            Array.from(targetWinnerSelect.options).forEach(opt => {
                if(opt.value !== 'random') { const h = horses.find(h => h.id == opt.value); if(h) opt.text = `Chỉ định: ${h.name}`; }
            });
        }

        function resetFullGame() { document.getElementById('numHorses').value = 5; roundNumber = 1; document.getElementById('roundCounterBadge').innerText = `Vòng ${roundNumber}`; handleGenerateBtn(); }

        function formatExactTime(dateObj) {
            const h = dateObj.getHours().toString().padStart(2, '0'); const m = dateObj.getMinutes().toString().padStart(2, '0');
            const s = dateObj.getSeconds().toString().padStart(2, '0'); const ms = dateObj.getMilliseconds().toString().padStart(3, '0');
            return `${h}:${m}:${s}.${ms}`;
        }

        function startRace() {
            isTurboActivated = false;
            bgMusic.currentTime = 0; bgMusic.play().catch(e => console.log("Cần tương tác"));
            if(winAudio) { winAudio.volume = 0; winAudio.play().then(() => { winAudio.pause(); winAudio.volume = 1; winAudio.currentTime = 0; }).catch(e=>{}); }

            const mode = document.getElementById('raceModeSelect').value;
            if (mode === 'lanes') startLanesRace();
            else startRandomRace();
        }

        // ====================== 1. ĐUA THEO LÀN ======================
        function startLanesRace() {
            setupMode.classList.add('hidden'); racingMode.classList.replace('hidden', 'flex');
            const selectedRacer = document.getElementById('racerType').value; const config = racerConfigs[selectedRacer];
            
            trackContainer.className = `flex-1 overflow-y-auto relative w-full h-full shadow-2xl ${config.bgClass}`;
            trackContainer.innerHTML = `
                <div class="finish-line absolute top-0 bottom-0 right-[3%] w-2.5 z-0 opacity-90"></div>
                <div id="lanesContainer" class="flex flex-col relative z-10 w-full min-h-full pb-2"></div>
            `;
            const lanesContainer = document.getElementById('lanesContainer');
            const totalCount = Math.max(horses.length, 1);
            let laneHeight = Math.max(22, Math.floor((window.innerHeight - 60) / totalCount));
            laneHeight = Math.min(laneHeight, 55); 
            
            let racerSize = Math.max(16, Math.floor(laneHeight * 0.75));
            let fontSize = Math.max(0.55, Math.min(0.85, (laneHeight * 0.35) / 16));
            
            horses.forEach(h => {
                h.progress = 0; const lane = document.createElement('div');
                lane.className = `relative w-full flex items-center overflow-hidden z-10 ${config.laneClass}`; 
                lane.style.height = `${laneHeight}px`;
                
                const racerContent = config.isSvg 
                    ? `<div class="${config.iconClass}" style="width: ${racerSize}px; height: ${racerSize}px; display:inline-block;">${config.emoji}</div>`
                    : `<div class="${config.iconClass}" style="font-size: ${Math.max(12, racerSize)}px;">${config.emoji}</div>`;

                lane.innerHTML = `
                    <div class="absolute left-4 font-bold opacity-90 w-[110px] md:w-[150px] truncate z-20 text-white drop-shadow-md tracking-wide" style="font-size: ${fontSize}rem;">${h.name}</div>
                    <div id="horse-ui-${h.id}" class="racer-wrapper" style="left: calc(130px + 0%);">
                        <div class="${config.effectClass}"></div>
                        <div class="speed-trail trail-1"></div><div class="speed-trail trail-2"></div><div class="speed-trail trail-3"></div>
                        ${racerContent}
                    </div>
                `;
                lanesContainer.appendChild(lane);
            });

            currentWinners = [];
            const durationSec = parseFloat(document.getElementById('raceDuration').value) || 10;
            let targetTopN = parseInt(document.getElementById('topN').value) || 1;
            targetTopN = Math.max(1, Math.min(targetTopN, 20, horses.length));
            document.getElementById('topN').value = targetTopN;
            const targetId = targetWinnerSelect.value; const fps = 25; const maxStep = 100 / (durationSec * fps * 0.85);

            raceInterval = setInterval(() => {
                let newlyFinished = []; 
                horses.forEach(h => {
                    if (h.progress >= 100) return;
                    let step = Math.random() * maxStep;
                    
                    if (targetId !== "random") {
                        if (h.id == targetId) {
                            step = step * 1.3; 
                            if (h.progress >= 80 && !isTurboActivated) {
                                isTurboActivated = true;
                                const vipEl = document.getElementById(`horse-ui-${targetId}`);
                                if (vipEl) vipEl.classList.add('vip-turbo');
                            }
                        } else { 
                            const vip = horses.find(x => x.id == targetId); 
                            if (vip && vip.progress < 100 && h.progress + step >= 99) step = 99 - h.progress; 
                        }
                    }
                    
                    h.progress += step;
                    const el = document.getElementById(`horse-ui-${h.id}`);
                    if (el) el.style.left = `calc(130px + ${(Math.min(h.progress, 100) * 0.78)}%)`; 
                    if (h.progress >= 100 && !currentWinners.find(w => w.id === h.id)) newlyFinished.push({...h});
                });

                if(newlyFinished.length > 0) {
                    newlyFinished.sort((a, b) => b.progress - a.progress);
                    let baseNow = Date.now();
                    newlyFinished.forEach((nf, idx) => { nf.exactTimeDate = new Date(baseNow + (idx * 25)); currentWinners.push(nf); });
                }

                if (currentWinners.length >= targetTopN || currentWinners.length === horses.length) {
                    currentWinners = currentWinners.slice(0, targetTopN);
                    clearInterval(raceInterval); bgMusic.pause(); 
                    if(winAudio) { winAudio.currentTime = 0; winAudio.play().catch(e=>console.log(e)); }
                    saveHistory(currentWinners); showWinners(currentWinners); 
                }
            }, 1000/fps);
        }

        // ====================== 2. ĐUA TỰ DO (RANDOM SURVIVAL) ======================
        function startRandomRace() {
            setupMode.classList.add('hidden'); racingMode.classList.replace('hidden', 'flex');
            
            const selectedRacer = document.getElementById('racerType').value; const config = racerConfigs[selectedRacer];
            trackContainer.className = `flex-1 relative w-full h-full overflow-hidden ${config.bgClass}`;
            
            trackContainer.innerHTML = `
                <div class="absolute inset-0 z-0 opacity-30" style="background-image: radial-gradient(rgba(255,255,255,0.15) 1px, transparent 1px); background-size: 32px 32px;"></div>
                <div id="dangerBorder" class="absolute inset-0 z-0 pointer-events-none transition-all duration-300"></div>
                <div id="countdownDisplay" class="absolute inset-0 flex items-center justify-center text-[15rem] md:text-[25rem] font-black text-white/5 pointer-events-none z-0 tracking-tighter transition-colors duration-500"></div>
                <div id="randomArena" class="absolute inset-0 z-10 transition-all duration-1000"></div>
            `;
            const arena = document.getElementById('randomArena');
            const countdownEl = document.getElementById('countdownDisplay');

            horses.forEach(h => {
                h.x = Math.random() * 85; h.y = Math.random() * 80; 
                h.vx = (Math.random() - 0.5) * 1.8; h.vy = (Math.random() - 0.5) * 1.8; 

                const el = document.createElement('div');
                el.className = 'absolute flex flex-col items-center justify-center z-20 transition-transform duration-100';
                el.id = `horse-ui-${h.id}`;
                el.style.left = `${h.x}%`; el.style.top = `${h.y}%`;
                
                const racerContent = config.isSvg 
                    ? `<div class="${config.iconClass}" style="width: 45px; height: 45px; display:inline-block;">${config.emoji}</div>`
                    : `<div class="${config.iconClass}" style="font-size: 2rem;">${config.emoji}</div>`;

                el.innerHTML = `
                    <div class="text-[10px] font-bold bg-black/70 px-2 py-0.5 rounded-md text-white shadow-md mb-1 whitespace-nowrap border border-white/10">${h.name}</div>
                    <div class="racer-wrapper static">
                        <div class="${config.effectClass}"></div>
                        <div class="speed-trail trail-1"></div><div class="speed-trail trail-2"></div><div class="speed-trail trail-3"></div>
                        ${racerContent}
                    </div>
                `;
                arena.appendChild(el);
            });

            currentWinners = [];
            const durationSec = parseFloat(document.getElementById('raceDuration').value) || 10;
            let timeLeft = durationSec;
            
            let targetTopN = parseInt(document.getElementById('topN').value) || 1;
            targetTopN = Math.max(1, Math.min(targetTopN, 20, horses.length));
            document.getElementById('topN').value = targetTopN;
            
            const targetId = targetWinnerSelect.value;
            const fps = 30; const tick = 1000/fps;

            countdownEl.innerText = Math.ceil(timeLeft);

            raceInterval = setInterval(() => {
                horses.forEach(h => {
                    h.vx += (Math.random() - 0.5) * 0.3; h.vy += (Math.random() - 0.5) * 0.3;
                    const maxSpeed = 1.2;
                    if (h.vx > maxSpeed) h.vx = maxSpeed; if (h.vx < -maxSpeed) h.vx = -maxSpeed;
                    if (h.vy > maxSpeed) h.vy = maxSpeed; if (h.vy < -maxSpeed) h.vy = -maxSpeed;

                    h.x += h.vx; h.y += h.vy;
                    if (h.x <= 0) { h.x = 0; h.vx *= -1; } if (h.x >= 92) { h.x = 92; h.vx *= -1; }
                    if (h.y <= 0) { h.y = 0; h.vy *= -1; } if (h.y >= 85) { h.y = 85; h.vy *= -1; }

                    const el = document.getElementById(`horse-ui-${h.id}`);
                    if (el) {
                        el.style.left = `${h.x}%`; el.style.top = `${h.y}%`;
                    }
                });

                timeLeft -= (tick / 1000);
                countdownEl.innerText = Math.ceil(timeLeft);

                if (timeLeft <= 2.0 && !isTurboActivated) {
                    isTurboActivated = true;
                    const dangerBorder = document.getElementById('dangerBorder');
                    if (dangerBorder) {
                        dangerBorder.style.boxShadow = "inset 0 0 120px rgba(244, 63, 94, 0.6)";
                        setInterval(() => { dangerBorder.style.opacity = dangerBorder.style.opacity == "0" ? "1" : "0"; }, 250);
                    }
                    countdownEl.style.color = "rgba(244, 63, 94, 0.2)";

                    if (targetId !== "random") {
                        const vipEl = document.getElementById(`horse-ui-${targetId}`);
                        if (vipEl) {
                            vipEl.classList.add('vip-turbo');
                            arena.appendChild(vipEl);
                        }
                    }
                }

                // ================= KHI HẾT GIỜ =================
                if (timeLeft <= 0) {
                    clearInterval(raceInterval);
                    bgMusic.pause(); 
                    if(winAudio) { winAudio.currentTime = 0; winAudio.play().catch(e=>console.log(e)); }

                    countdownEl.innerText = "HẾT GIỜ!";
                    countdownEl.style.color = "rgba(255, 255, 255, 0.6)";
                    if (document.getElementById('dangerBorder')) document.getElementById('dangerBorder').style.display = 'none';
                    
                    arena.style.background = "radial-gradient(circle at center, rgba(56, 189, 248, 0.1) 0%, rgba(3, 7, 18, 0.9) 100%)";

                    let pool = horses.map(h => h); 
                    currentWinners = [];
                    
                    if (targetId !== "random") {
                        const vipIndex = pool.findIndex(x => x.id == targetId);
                        if (vipIndex !== -1) { currentWinners.push(pool[vipIndex]); pool.splice(vipIndex, 1); }
                    }
                    while(currentWinners.length < targetTopN && pool.length > 0) {
                        const randIdx = Math.floor(Math.random() * pool.length);
                        currentWinners.push(pool[randIdx]); pool.splice(randIdx, 1);
                    }

                    let baseNow = Date.now();
                    currentWinners.forEach((cw, idx) => { cw.exactTimeDate = new Date(baseNow + (idx * 25)); });

                    horses.forEach(h => {
                        const el = document.getElementById(`horse-ui-${h.id}`);
                        if (el) {
                            const icon = el.querySelector('.racer-icon, .racer-icon-flip, .racer-icon-bird');
                            if(icon) icon.style.transform = ''; 

                            if (currentWinners.find(w => w.id === h.id)) {
                                const winIndex = currentWinners.findIndex(w => w.id === h.id);
                                el.classList.remove('vip-turbo'); 
                                el.classList.add('winner-pop'); 
                                
                                const totalWins = currentWinners.length;
                                const gap = totalWins > 5 ? (80 / totalWins) : 15; 
                                const offset = (winIndex - (totalWins - 1) / 2) * gap;
                                
                                el.style.left = `calc(50% + ${offset}%)`;
                                el.style.top = '50%';
                                el.style.transform = `translate(-50%, -50%) scale(${totalWins > 5 ? 1.5 : 2.5})`;
                                arena.appendChild(el); 
                            } else {
                                el.classList.add('loser-fade');
                            }
                        }
                    });

                    setTimeout(() => {
                        saveHistory(currentWinners); showWinners(currentWinners); 
                    }, 3500);
                }
            }, tick);
        }

        // =========================================================================

        function saveHistory(winnersList) {
            const emptyMsg = document.getElementById('emptyHistoryMsg'); if (emptyMsg) emptyMsg.remove();
            const winnerNamesText = winnersList.map((w, index) => `${index + 1}. ${w.name}`).join(' • ');
            const item = document.createElement('div'); item.className = "flex flex-col bg-black/20 p-3 rounded-xl border border-white/5 text-xs mb-2";
            item.innerHTML = `
                <div class="flex justify-between items-center mb-1">
                    <span class="font-bold theme-text">Vòng ${roundNumber}</span>
                    <span class="text-[10px] text-muted">Đã ghi nhận</span>
                </div>
                <div class="font-semibold text-white/90 truncate">${winnerNamesText}</div>
            `;
            historyList.prepend(item); 
            winnersList.forEach((w, index) => {
                const timeWithMs = formatExactTime(w.exactTimeDate);
                raceHistory.push({ round: roundNumber, rank: index + 1, name: w.name, time: timeWithMs });
            });
        }

        function exportExcel() {
            const eventName = document.getElementById('eventNameInput').value.trim() || "KetQua_Dua";
            const safeFileName = eventName.replace(/[^a-z0-9]/gi, '_').toLowerCase();

            if (raceHistory.length === 0) { alert("Chưa có dữ liệu!"); return; }
            let csvContent = "data:text/csv;charset=utf-8,\uFEFFVong Dua,Hang,Ten Nguoi Thang,Thoi Gian (Chinh xac Ms)\n";
            raceHistory.forEach(row => { csvContent += `${row.round},${row.rank},"${row.name}","${row.time}"\n`; });
            const link = document.createElement("a"); link.setAttribute("href", encodeURI(csvContent)); 
            link.setAttribute("download", `${safeFileName}.csv`);
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }

        function showWinners(winnersList) {
            document.getElementById('winRoundText').innerText = roundNumber;
            const container = document.getElementById('winnersList'); container.innerHTML = ''; 
            winnersList.forEach((w, index) => {
                const rank = index + 1;
                let rankDisplay = rank === 1 ? '🥇 Hạng 1' : rank === 2 ? '🥈 Hạng 2' : rank === 3 ? '🥉 Hạng 3' : `🏅 Hạng ${rank}`;
                let colorClass = rank === 1 ? 'theme-text text-xl font-black' : 'text-white/80 text-sm font-bold';
                container.innerHTML += `
                    <div class="flex items-center justify-between bg-black/30 p-3 rounded-xl border border-white/5">
                        <span class="font-semibold text-muted text-xs w-20 text-left">${rankDisplay}</span>
                        <div class="flex-1 text-left flex flex-col justify-center truncate px-2">
                            <span class="${colorClass} truncate leading-tight">${w.name}</span>
                            ${rank === 1 ? `<span class="text-[10px] text-muted mt-0.5 font-mono">🕒 ${formatExactTime(w.exactTimeDate)}</span>` : ''}
                        </div>
                    </div>
                `;
            });
            winnerModal.classList.replace('hidden', 'flex');
        }

        function goToSetup() { clearInterval(raceInterval); bgMusic.pause(); winnerModal.classList.replace('flex', 'hidden'); racingMode.classList.replace('flex', 'hidden'); setupMode.classList.remove('hidden'); renderInputs(); }
        
        function rematch() { 
            const toRemove = raceHistory.filter(r => r.round === roundNumber).length;
            raceHistory.splice(-toRemove, toRemove); 
            if(historyList.firstChild) historyList.removeChild(historyList.firstChild);
            if(raceHistory.length === 0) historyList.innerHTML = '<p class="text-muted text-xs text-center italic mt-6" id="emptyHistoryMsg">Chưa có kết quả ghi nhận</p>';
            goToSetup(); 
        }
        
        function nextRound() {
            const winnerIds = currentWinners.map(w => w.id);
            horses = horses.filter(h => !winnerIds.includes(h.id));
            document.getElementById('numHorses').value = horses.length;
            roundNumber++; document.getElementById('roundCounterBadge').innerText = `Vòng ${roundNumber}`; goToSetup();
        }

        function toggleFullScreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(e => console.log(e)); else document.exitFullscreen(); }
        
        updateEventName(document.getElementById('eventNameInput').value);
        handleGenerateBtn();
    </script>
</body>
</html>
